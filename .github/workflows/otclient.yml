name: OTClient - AMD64

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - "otclient/**"
  push:
    paths:
    - "otclient/**"
    branches:
    - main

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ github.token }}

  docker-image:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true
        driver-opts: image=moby/buildkit:latest

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build and push (for tags)
      if: github.ref_type == 'tag'
      uses: docker/build-push-action@v6
      with:
        context: ./otclient
        file: ./otclient/Dockerfile.amd
        push: true
        tags: ghcr.io/${{ github.repository }}/otclient-amd:${{ github.ref_name }}
        platforms: linux/amd64

    - name: Build and push (for branches)
      if: github.event_name == 'pull_request' || github.ref_type == 'branch'
      uses: docker/build-push-action@v6
      with:
        context: ./otclient
        file: ./otclient/Dockerfile.amd
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository }}/otclient-amd:latest
        platforms: linux/amd64
